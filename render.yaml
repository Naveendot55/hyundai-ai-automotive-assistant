services:
  - type: web
    name: hyundai-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GENERATIVE_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: EMBEDDING_DIMENSIONS
        value: "768"
